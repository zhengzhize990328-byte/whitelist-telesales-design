    function performancePage(){return `${head(x("আমার পারফরম্যান্স","个人绩效"),x("১ আগস্ট · ঢাকা সময়","8 月 1 日 · 达卡时间"),`<button class="btn">${x("আজ","今日")}</button><button class="btn">${x("এই সপ্তাহ","本周")}</button>`)}${stats([[x("বরাদ্দ","分配"),"26",x("দলের গড়ের চেয়ে +8%","高于团队均值 8%")],[x("সংযুক্ত","接通"),"12","46.2%"],[x("আগ্রহী","意向"),"7","58.3%"],[x("আবেদন শুরু","申请启动"),"6","85.7%"]])}<div class="grid-2 grid-even"><section class="panel"><div class="panel-head"><b>${x("আজকের রূপান্তর","今日转化")}</b><span>${x("ব্যক্তিগত ফানেল","个人漏斗")}</span></div><div class="panel-body"><div class="bar-row"><span>${x("বরাদ্দ","已分配")}</span><div class="bar"><span style="width:100%"></span></div><b>26</b></div><div class="bar-row"><span>${x("কল সম্পন্ন","完成拨打")}</span><div class="bar"><span style="width:69%"></span></div><b>18</b></div><div class="bar-row"><span>${x("সংযুক্ত","接通")}</span><div class="bar"><span style="width:46%;background:var(--green)"></span></div><b>12</b></div><div class="bar-row"><span>${x("আগ্রহী","意向")}</span><div class="bar"><span style="width:27%;background:var(--green)"></span></div><b>7</b></div><div class="bar-row"><span>${x("আবেদন","申请")}</span><div class="bar"><span style="width:23%"></span></div><b>6</b></div></div></section><section class="panel"><div class="panel-head"><b>${x("গুণমান ও শৃঙ্খলা","质量与执行")}</b></div><table class="metric-table"><tr><th>${x("সূচক","指标")}</th><th>${x("আপনি","个人")}</th><th>${x("দল","团队")}</th></tr><tr><td>${x("সময়ে প্রথম কল","首呼及时率")}</td><td>94.4%</td><td>91.1%</td></tr><tr><td>${x("ফলাফল সম্পূর্ণতা","结果完整率")}</td><td>100%</td><td>98.7%</td></tr><tr><td>${x("ফেরত কল সময়মতো","回拨准时率")}</td><td>87.5%</td><td>90.2%</td></tr><tr><td>${x("রেকর্ডিং প্রস্তুত","录音完整率")}</td><td>100%</td><td>99.4%</td></tr></table></section></div>`}
    const pages={login:loginPage,today:todayPage,customer:customerPage,call:callPage,result:resultPage,callbacks:callbacksPage,performance:performancePage};
    function render(){
      document.title=isZh?`${isId?"印尼":"孟加拉"} Web 电销坐席端｜中文讲解`:`Linha Clara · ${isId?"Indonesia":"Bangladesh"} Agent Desk`;
      document.getElementById("brandMarket").textContent=isId?"Indonesia · Bahasa Indonesia":"Bangladesh · বাংলা";
      document.getElementById("navScope").textContent=x("আমার কাজ","我的工作");
      document.getElementById("nav").innerHTML=navItems.map(n=>`<button data-go="${n[0]}" class="${state.page===n[0]?"active":""}">${n[1]}</button>`).join("");
      document.getElementById("agentName").textContent=x("রাফি আহমেদ","Rafi Ahmed");
      document.getElementById("agentState").textContent=state.online?x("অনলাইন","在线"):x("বিরতি","暂停");
      document.getElementById("capacityText").textContent=x("ক্ষমতা 14 / 24","容量 14 / 24");
      document.getElementById("crumb").innerHTML=`${isZh?(isId?"印尼":"孟加拉"):x("বাংলাদেশ","孟加拉")} / <b>${navItems.find(n=>n[0]===state.page)[1]}</b>`;
      document.getElementById("countrySelect").value=isId?"id":"bd";
      document.getElementById("langLink").textContent=isZh?(isId?"Bahasa Indonesia 业务版":"বাংলা业务版"):"中文讲解版";
      document.getElementById("langLink").href=isZh?(isId?"indonesia-web.html":"bangladesh-web.html"):(isId?"indonesia-web-zh.html":"bangladesh-web-zh.html");
      document.getElementById("sessionButton").textContent=x("শিফট","班次");
      document.getElementById("main").innerHTML=adaptMarket(pages[state.page]());
      document.querySelectorAll(".priority").forEach(el=>{el.classList.add("eligibility");el.innerHTML=`<b>✓</b><small>${x("যোগ্য","符合资格")}</small>`});
      bindPage();
    }
    function go(page){if(page==="today")state.customerKey="current";state.page=page;render();}
    function bindPage(){document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll("[data-follow-tab]").forEach(el=>el.onclick=()=>{state.followupTab=el.dataset.followTab;render()});document.querySelectorAll("[data-follow-action]").forEach(el=>el.onclick=()=>{state.customerKey="followup";go("customer")});document.querySelectorAll("[data-follow-call]").forEach(el=>el.onclick=()=>{state.customerKey="followup";go("call")});document.querySelectorAll("[data-history-call]").forEach(el=>el.onclick=()=>{state.customerKey=el.dataset.historyCall;go("call")});const start=document.getElementById("startShift");if(start)start.onclick=()=>{state.online=true;showToast(x("শিফট শুরু হয়েছে","班次已开始"));go("today")};const pause=document.getElementById("pauseShift");if(pause)pause.onclick=()=>{state.online=!state.online;showToast(state.online?x("আপনি আবার অনলাইন","已恢复接单"):x("নতুন বরাদ্দ স্থগিত","已暂停新案件派发"));render()};const req=document.getElementById("requestRelease");if(req)req.onclick=openRelease;const call=document.getElementById("callButton");if(call)call.onclick=toggleCall;document.querySelectorAll("[data-result]").forEach(el=>el.onclick=()=>{state.result=el.dataset.result;render()});const save=document.getElementById("saveResult");if(save)save.onclick=()=>{const followup=["callback","noanswer","busy"].includes(state.result);showToast(followup?x("দ্বিতীয় যোগাযোগ তৈরি হয়েছে · আজকের ডেস্কে ফিরুন","二次触达已创建 · 返回今日工作台"):x("ফলাফল সংরক্ষিত · পরবর্তী কেস প্রস্তুত","结果已保存 · 下一位客户已准备"));state.result="";state.followupTab="pending";go("today")};}
    function formatTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
    function toggleCall(){state.calling=!state.calling;if(state.calling){state.timer=setInterval(()=>{state.seconds++;const t=document.getElementById("callTimer");if(t)t.textContent=formatTime(state.seconds)},1000);showToast(x("কল সংযুক্ত · রেকর্ডিং চলছে","通话已接通 · 正在录音"));render()}else{clearInterval(state.timer);state.timer=null;showToast(x("কল শেষ · ফলাফল নিবন্ধন করুন","通话结束 · 请登记结果"));go("result")}}
    function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
    function openRelease(){document.getElementById("releaseTitle").textContent=x("কেস রিলিজের আবেদন","申请释放案件");document.getElementById("releaseNote").textContent=x("রিলিজ করলে কেসটি Dhaka A পুলে ফিরে যাবে। ইতিহাস ও গ্রাহকের অবস্থা সংরক্ষিত থাকবে।","释放后案件返回 Dhaka A 队列，沟通历史和客户状态不会被清空。");document.getElementById("releaseReasonLabel").textContent=x("কারণ","释放原因");document.getElementById("releaseReason").innerHTML=`<option>${x("ভাষা বা পণ্য মেলে না","语言或产品不匹配")}</option><option>${x("প্রযুক্তিগত সমস্যা","技术问题")}</option><option>${x("গ্রাহক নির্দিষ্ট কর্মী চেয়েছেন","客户要求指定坐席")}</option>`;document.getElementById("releaseCommentLabel").textContent=x("বিস্তারিত মন্তব্য","补充说明");document.getElementById("releaseComment").placeholder=x("কারণ লিখুন","请填写具体原因");document.getElementById("releaseCancel").textContent=x("বাতিল","取消");document.getElementById("releaseConfirm").textContent=x("আবেদন জমা দিন","提交申请");document.getElementById("releaseModal").classList.add("show")}
    document.addEventListener("click",e=>{if(e.target.matches("[data-close-modal]"))document.getElementById("releaseModal").classList.remove("show")});
    document.getElementById("releaseConfirm").onclick=()=>{document.getElementById("releaseModal").classList.remove("show");showToast(x("রিলিজের আবেদন সুপারভাইজারের কাছে পাঠানো হয়েছে","释放申请已提交主管审批"));go("today")};
    document.getElementById("countrySelect").onchange=e=>{location.href=e.target.value==="id"?(isZh?"indonesia-web-zh.html":"indonesia-web.html"):(isZh?"bangladesh-web-zh.html":"bangladesh-web.html")};
    function updateClock(){document.getElementById("clock").textContent=new Intl.DateTimeFormat(isZh?"zh-CN":isId?"id-ID":"bn-BD",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:isId?"Asia/Jakarta":"Asia/Dhaka"}).format(new Date())}
    setInterval(updateClock,1000);render();updateClock();
  </script>
