<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>白名单电销统一后管｜案件分配中心</title>
  <!--
    已确认方向：第一套 Clear Operations。
    管理边界：同一后台管理安哥拉和孟加拉，但正常案件调配只能发生在同一市场内。
    状态原则：业务处理状态与案件归属状态分离；释放不清空客户进度，调配保留完整负责人链路。
    本原型使用演示数据，不连接真实名单、坐席、电话或业务状态接口。
  -->
  <style>
    *{box-sizing:border-box}
    :root{--nav:#10233f;--nav-2:#18375f;--blue:#2563eb;--blue-pale:#e9f0ff;--green:#11845b;--green-pale:#e8f6f0;--amber:#bb7417;--amber-pale:#fff3da;--red:#bf4747;--red-pale:#fff0f0;--ink:#14213a;--muted:#68758b;--line:#d7dfeb;--soft:#f3f6fa;--paper:#fff}
    html,body{margin:0;min-height:100%;background:var(--soft);color:var(--ink)}
    body{font-family:"Avenir Next","Noto Sans SC","PingFang SC",sans-serif;font-size:13px}
    button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}
    .sidebar{background:var(--nav);color:#fff;min-height:100vh;height:100vh;position:sticky;top:0;padding:22px 14px;display:flex;flex-direction:column}
    .brand{padding:0 10px 22px;border-bottom:1px solid rgba(255,255,255,.13)}.brand b{display:block;font-size:17px}.brand small{display:block;color:#9eb0ca;font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
    .scope{margin:17px 10px 8px;color:#8195b2;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .nav{display:grid;gap:2px}.nav button{position:relative;border:0;background:transparent;color:#bdcadc;text-align:left;padding:10px 12px;font-weight:700}.nav button:hover{background:#152f53;color:#fff}.nav button.active{background:#1d3e6b;color:#fff}.nav button.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#4d7fff}
    .side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.13);padding:15px 10px 0;color:#aab9cd}.side-foot b{display:block;color:#fff;margin-bottom:4px}.side-foot small{font-size:10px}.side-foot .role{margin-top:10px;color:#7de3b7}
    .shell{min-width:0}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.crumb{color:var(--muted)}.crumb b{color:var(--ink)}
    .top-actions{display:flex;align-items:center;gap:9px}.market{height:34px;border:1px solid var(--line);background:#fff;padding:0 11px;font-weight:700}.sync{color:var(--green);font-weight:800}.user{height:34px;border:1px solid var(--line);background:#fff;padding:0 12px;font-weight:700}
    .main{padding:26px 28px 46px;max-width:1600px;margin:0 auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin-bottom:17px}.head h1{font-size:27px;letter-spacing:-.02em;margin:0 0 6px}.head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{height:38px;border:1px solid var(--line);background:#fff;padding:0 15px;font-weight:800}.btn:hover{border-color:#8ba3c3}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.danger{border-color:#dfb6b6;color:#a13a3a;background:#fff}.btn.warning{border-color:#e7cc9d;color:#895913;background:#fffaf0}.btn:disabled{opacity:.45;cursor:not-allowed}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);background:#fff;margin-bottom:15px}.stat{padding:15px 16px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat small{display:block;color:var(--muted);margin-bottom:8px}.stat b{font-size:22px}.stat em{display:block;margin-top:5px;font-style:normal;color:var(--green);font-size:9px;font-weight:800}.stat em.warn{color:var(--amber)}.stat em.bad{color:var(--red)}
    .grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr);gap:14px}.grid-even{grid-template-columns:1fr 1fr}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
    .panel{background:#fff;border:1px solid var(--line)}.panel-head{min-height:47px;border-bottom:1px solid var(--line);padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head b{font-size:14px}.panel-head span,.panel-head small{font-size:10px;color:var(--muted)}.panel-body{padding:15px}
    .notice{padding:11px 13px;background:var(--blue-pale);color:#244d99;border:1px solid #cedbf6;line-height:1.55}.notice.green{background:var(--green-pale);color:#146546;border-color:#cbe7db}.notice.amber{background:var(--amber-pale);color:#805414;border-color:#edd7a9}.notice.red{background:var(--red-pale);color:#933b3b;border-color:#edcaca}
    .bar-row{display:grid;grid-template-columns:115px 1fr 60px;gap:11px;align-items:center;margin:13px 0}.bar{height:8px;background:#e8edf4}.bar span{height:100%;display:block;background:var(--blue)}.bar-row b{text-align:right}.quality{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:15px;padding-top:14px}.quality div{border-right:1px solid var(--line);padding-left:12px}.quality div:first-child{padding-left:0}.quality div:last-child{border-right:0}.quality small{display:block;color:var(--muted);margin-bottom:6px}.quality b{font-size:17px}
    .alert-list{display:grid;gap:8px}.alert{border:1px solid var(--line);padding:11px 12px;display:grid;grid-template-columns:8px 1fr;gap:11px}.alert:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);margin-top:3px}.alert.good:before{background:var(--green)}.alert.bad:before{background:var(--red)}.alert b{display:block;font-size:11px;margin-bottom:4px}.alert p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}
    .filters{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr)) auto;gap:8px;margin-bottom:11px}.filters select,.filters input{height:36px;border:1px solid var(--line);background:#fff;padding:0 9px}
    .table-wrap{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}th{background:#f8fafc;color:var(--muted);font-size:9px;letter-spacing:.02em}td{font-size:11px}tbody tr:hover{background:#f8fbff}td strong{font-size:11px}.sub{display:block;margin-top:3px;color:var(--muted);font-size:9px}.num{text-align:right}.check{width:15px;height:15px;accent-color:var(--blue)}
    .tag{display:inline-flex;width:max-content;padding:5px 7px;background:var(--blue-pale);color:#2454a6;font-size:9px;font-weight:800}.tag.green{background:var(--green-pale);color:var(--green)}.tag.amber{background:var(--amber-pale);color:#915b12}.tag.red{background:var(--red-pale);color:#a13c3c}.tag.gray{background:#edf1f5;color:#637086}
    .batch{border:1px solid var(--line);background:#fff;padding:15px}.batch-top{display:flex;justify-content:space-between;gap:10px}.batch h3{margin:0 0 5px}.batch p{margin:0;color:var(--muted);font-size:10px}.batch-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:13px}.batch-metrics small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.batch-metrics b{font-size:16px}
    .upload-box{border:1px dashed #91a4bd;background:#f9fbfd;min-height:210px;display:grid;place-items:center;text-align:center}.upload-box h3{margin:0 0 7px}.upload-box p{margin:0 0 15px;color:var(--muted)}.file-ready{display:none;margin-top:13px;color:var(--green);font-weight:800}.file-ready.show{display:block}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:10px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;padding:10px;width:100%}.field textarea{min-height:80px;resize:vertical}
    .queue-tabs{display:flex;border-bottom:1px solid var(--line);background:#fff}.queue-tabs button{border:0;border-right:1px solid var(--line);background:#fff;padding:11px 14px;font-weight:700;color:var(--muted)}.queue-tabs button.active{color:var(--blue);box-shadow:inset 0 -3px var(--blue)}
    .split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px}.case-list{background:#fff;border:1px solid var(--line)}.case-item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.case-item:hover,.case-item.active{background:var(--blue-pale)}.case-item:last-child{border-bottom:0}.case-item b{display:flex;justify-content:space-between;gap:10px}.case-item p{margin:5px 0 0;color:var(--muted);font-size:10px}.case-detail h2{margin:0 0 5px}.case-detail>p{margin:0;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-width:0 1px 1px 0;margin-top:14px}.detail-grid div{padding:11px;border:1px solid var(--line);border-width:1px 0 0 1px}.detail-grid small{display:block;color:var(--muted);margin-bottom:5px}.detail-grid b{font-size:11px}
    .team-row{display:grid;grid-template-columns:1.3fr 80px 90px 1fr 80px;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}.team-row:last-child{border-bottom:0}.team-row p{margin:3px 0 0;color:var(--muted);font-size:9px}.capacity-bar{height:7px;background:#e8edf4}.capacity-bar span{display:block;height:100%;background:var(--green)}
    .rule-step{border-left:3px solid #cbd7e8;padding:12px 0 12px 15px}.rule-step.active{border-color:var(--blue);background:#f8faff}.rule-step b{display:block}.rule-step p{margin:5px 0 0;color:var(--muted);font-size:10px}.weight{display:grid;grid-template-columns:150px 1fr 50px;gap:12px;align-items:center;margin:15px 0}.weight input{accent-color:var(--blue)}.weight b{text-align:right}
    .toggle{width:38px;height:20px;border:0;border-radius:99px;background:#aeb9c8;position:relative}.toggle:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s}.toggle.on{background:var(--green)}.toggle.on:after{left:21px}
    .preview-card{background:#fff;border:1px solid var(--line)}.preview-line{display:flex;justify-content:space-between;gap:14px;padding:12px;border-bottom:1px solid var(--line)}.preview-line:last-child{border-bottom:0}.preview-line span{color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(10,24,45,.5);display:none;place-items:center;z-index:40}.modal.show{display:grid}.modal-card{width:min(570px,calc(100vw - 30px));max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line)}.modal-head{padding:17px 18px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
    .toast{position:fixed;right:24px;bottom:24px;min-width:320px;background:#172844;color:#fff;padding:14px 16px;box-shadow:0 16px 40px rgba(16,35,63,.24);transform:translateY(90px);opacity:0;transition:.25s;z-index:50}.toast.show{transform:none;opacity:1}
    @media(max-width:1120px){.app{grid-template-columns:195px minmax(0,1fr)}.grid-2,.grid-even,.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.filters{grid-template-columns:1fr 1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><b>Linha Clara Control</b><small>Global allocation console</small></div>
      <div class="scope">全局运营</div><nav class="nav" id="navGlobal"></nav>
      <div class="scope">分配与组织</div><nav class="nav" id="navAllocation"></nav>
      <div class="side-foot"><b>林一凡</b><small>总部超级管理员</small><div class="role">可查看全部市场</div></div>
    </aside>
    <section class="shell">
      <header class="topbar"><div class="crumb" id="crumb"></div><div class="top-actions"><span class="sync">数据已同步</span><select class="market" id="marketSelect"><option value="all">全部市场</option><option value="ao">安哥拉</option><option value="bd">孟加拉</option></select><button class="user">中文 · 总部</button></div></header>
      <main class="main" id="main"></main>
    </section>
  </div>
  <div class="modal" id="actionModal"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3></div><div class="panel-body" id="modalBody"></div><div class="modal-actions"><button class="btn" data-close-modal>取消</button><button class="btn primary" id="modalConfirm">确认</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const navGlobal=[["overview","全球运营总览"],["upload","白名单上传"],["batches","批次管理"],["cases","案件分配中心"],["monitor","实时任务监控"]];
    const navAllocation=[["release","案件释放"],["transfer","批量调配"],["rules","分配规则"],["teams","团队与坐席"],["audit","操作审计"]];
    const state={page:"overview",market:"all",selected:new Set(["AO-0842","AO-0846","AO-0851"]),queue:"assigned",rulePublished:false,fileReady:false};
    const marketName=()=>state.market==="all"?"全部市场":state.market==="ao"?"安哥拉":"孟加拉";
    const head=(title,sub,actions="")=>`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;
    const stats=items=>`<section class="stats">${items.map(i=>`<div class="stat"><small>${i[0]}</small><b>${i[1]}</b>${i[2]?`<em class="${i[3]||""}">${i[2]}</em>`:""}</div>`).join("")}</section>`;
    function overview(){const data=state.market==="ao"?["2,714","2,342","196","27 / 30","392"]:state.market==="bd"?["3,842","3,116","405","64 / 72","428"]:["6,556","5,458","601","91 / 102","820"];return `${head("全球运营总览",`${marketName()} · 白名单分配与全生命周期转化`,`<button class="btn">刷新数据</button><button class="btn primary" data-go="upload">上传新名单</button>`)}${stats([["今日有效名单",data[0],"较昨日 +12.4%"],["成功分配",data[1],"83.3%"],["待分配",data[2],"需关注","warn"],["在线坐席",data[3],"容量正常"],["申请启动",data[4],"12.5%"]])}<div class="grid-2"><section class="panel"><div class="panel-head"><b>实时分配健康度</b><span>最近 30 分钟</span></div><div class="panel-body"><div class="bar-row"><span>通过准入</span><div class="bar"><span style="width:94%"></span></div><b>6,201</b></div><div class="bar-row"><span>已成功分配</span><div class="bar"><span style="width:83%;background:var(--green)"></span></div><b>5,458</b></div><div class="bar-row"><span>等待容量</span><div class="bar"><span style="width:12%;background:var(--amber)"></span></div><b>601</b></div><div class="bar-row"><span>分配异常</span><div class="bar"><span style="width:2%;background:var(--red)"></span></div><b>142</b></div><div class="quality"><div><small>平均等待</small><b>02:18</b></div><div><small>首呼及时率</small><b>91.7%</b></div><div><small>今日释放</small><b>126</b></div><div><small>今日调配</small><b>84</b></div></div></div></section><section class="panel"><div class="panel-head"><b>运营预警</b><span>按优先级</span></div><div class="panel-body alert-list"><article class="alert bad"><div><b>孟加拉有 37 个高优先案件等待容量</b><p>Dhaka A 当前容量 92%，建议调配至 Dhaka B。</p></div></article><article class="alert"><div><b>安哥拉 Luanda B 有 18 个案件超出首呼 SLA</b><p>其中 6 个坐席已离线超过 30 分钟。</p></div></article><article class="alert good"><div><b>跨市场重复触达率保持正常</b><p>当前 0.18%，未发现国家归属冲突。</p></div></article></div></section></div><section class="panel" style="margin-top:14px"><div class="panel-head"><b>市场对比</b><span>今日</span></div><div class="table-wrap" style="border:0"><table><thead><tr><th>市场</th><th>有效名单</th><th>已分配</th><th>首呼及时率</th><th>在线坐席</th><th>接通率</th><th>申请启动</th></tr></thead><tbody><tr><td><strong>安哥拉</strong><span class="sub">pt-AO · 3 个团队</span></td><td>2,714</td><td>2,342</td><td>93.1%</td><td>27 / 30</td><td>51.7%</td><td>392</td></tr><tr><td><strong>孟加拉</strong><span class="sub">bn-BD · 4 个团队</span></td><td>3,842</td><td>3,116</td><td>90.6%</td><td>64 / 72</td><td>48.8%</td><td>428</td></tr></tbody></table></div></section>`}
    function upload(){return `${head("白名单上传","上传前必须指定市场、主推广产品与责任团队")}<div class="grid-2 grid-even"><section class="panel"><div class="panel-head"><b>1. 名单文件</b><span>CSV / XLSX · 最大 50 MB</span></div><div class="panel-body"><div class="upload-box"><div><h3>选择白名单文件</h3><p>客户 ID、姓名、手机号为必填字段</p><button class="btn primary" id="simulateUpload">选择演示文件</button><div class="file-ready ${state.fileReady?"show":""}" id="fileReady">global_whitelist_0801.xlsx · 6,800 行已就绪</div></div></div></div></section><section class="panel"><div class="panel-head"><b>2. 批次与分配配置</b><span>全部必填</span></div><div class="panel-body"><div class="form-grid"><div class="field"><label>市场</label><select><option>孟加拉</option><option>安哥拉</option></select></div><div class="field"><label>批次名称</label><input value="BD · 复借 · 8 月 1 日"></div><div class="field"><label>主推广产品</label><select><option>ReLoan Plus</option><option>Cash Flex</option></select></div><div class="field"><label>责任团队</label><select><option>自动路由至合格团队</option><option>Dhaka A</option><option>Dhaka B</option></select></div><div class="field"><label>名单有效期</label><input type="date" value="2026-08-07"></div><div class="field"><label>分配开始</label><select><option>校验通过后立即分配</option><option>指定时间</option></select></div><div class="field full"><label>运营备注</label><textarea>已结清且满足复借资格的白名单客户</textarea></div></div><button class="btn primary" id="validateUpload" style="width:100%;margin-top:13px" ${state.fileReady?"":"disabled"}>校验、去重并生成分配预览</button></div></section></div>`}
    function batches(){return `${head("批次管理","暂停、继续或关闭白名单活动","<button class='btn primary' data-go='upload'>上传新批次</button>")}${stats([["今日批次","9"],["总名单","18,920"],["有效","17,846","94.3%"],["隔离数据","1,074","5.7%","warn"],["处理中","7","2 个已暂停","warn"]])}<div class="grid-3"><article class="batch"><div class="batch-top"><div><h3>BD · 复借 · 8 月 1 日</h3><p>孟加拉 · ReLoan Plus · 自动路由</p></div><span class="tag green">处理中</span></div><div class="batch-metrics"><div><small>有效</small><b>3,842</b></div><div><small>已分配</small><b>3,116</b></div><div><small>完成</small><b>1,874</b></div></div></article><article class="batch"><div class="batch-top"><div><h3>AO · Flex · 8 月 1 日</h3><p>安哥拉 · Crédito Flex · Luanda A</p></div><span class="tag green">处理中</span></div><div class="batch-metrics"><div><small>有效</small><b>2,714</b></div><div><small>已分配</small><b>2,342</b></div><div><small>完成</small><b>1,226</b></div></div></article><article class="batch"><div class="batch-top"><div><h3>BD · 首贷 · 7 月 31 日</h3><p>孟加拉 · Cash Flex · Dhaka B</p></div><span class="tag amber">已暂停</span></div><div class="batch-metrics"><div><small>有效</small><b>1,420</b></div><div><small>已分配</small><b>984</b></div><div><small>待处理</small><b>436</b></div></div></article></div><section class="panel" style="margin-top:14px"><div class="panel-head"><b>批次操作原则</b><span>暂停不会清空已经产生的任务</span></div><div class="panel-body notice">暂停批次后停止新增分配；已分配案件继续由原坐席处理。关闭批次前必须选择未完成案件的处置方式：保留、释放回市场池或终止推广。</div></section>`}
    const caseRows=[
      ["AO-0842","安哥拉","Joana Manuel","Crédito Flex","Luanda A / Ana Pedro","已分配","首呼剩余 08:12"],
      ["AO-0846","安哥拉","Mateus Domingos","Crédito Flex","Luanda A / Manuel José","待处理","首呼剩余 11:40"],
      ["AO-0851","安哥拉","Helena Costa","Crédito Flex","Luanda B / Beatriz João","跟进中","回拨 10:20"],
      ["BD-1138","孟加拉","Sabina Rahman","ReLoan Plus","Dhaka A / Rafi Ahmed","已分配","首呼剩余 06:32"],
      ["BD-1146","孟加拉","Marzia Akter","Cash Flex","Dhaka B / Nusrat Ali","等待业务","注册中"],
      ["BD-1152","孟加拉","Mohammad Naim","ReLoan Plus","—","分配异常","无产品权限坐席"]
    ];
    function caseTableRows(){return caseRows.filter(r=>state.market==="all"||(state.market==="ao"?r[1]==="安哥拉":r[1]==="孟加拉")).map(r=>`<tr><td><input class="check case-check" type="checkbox" value="${r[0]}" ${state.selected.has(r[0])?"checked":""}></td><td><strong>${r[0]}</strong><span class="sub">${r[2]}</span></td><td>${r[1]}</td><td>${r[3]}</td><td>${r[4]}</td><td><span class="tag ${r[5]==="分配异常"?"red":r[5]==="跟进中"||r[5]==="等待业务"?"amber":"green"}">${r[5]}</span></td><td>${r[6]}</td><td><button class="btn" data-view-case="${r[0]}">查看</button></td></tr>`).join("")}
    function cases(){return `${head("案件分配中心",`${marketName()} · 业务状态与归属状态分开管理`,`<button class="btn warning" id="releaseSelected">释放所选</button><button class="btn primary" id="transferSelected">调配所选</button>`)}<div class="queue-tabs"><button class="${state.queue==="unassigned"?"active":""}" data-queue="unassigned">待分配 601</button><button class="${state.queue==="assigned"?"active":""}" data-queue="assigned">已分配 5,458</button><button class="${state.queue==="released"?"active":""}" data-queue="released">已释放 126</button><button class="${state.queue==="exception"?"active":""}" data-queue="exception">分配异常 142</button><button class="${state.queue==="done"?"active":""}" data-queue="done">已完成 3,100</button></div><div class="filters" style="margin-top:11px"><select><option>全部产品</option><option>Crédito Flex</option><option>ReLoan Plus</option></select><select><option>全部团队</option><option>Luanda A</option><option>Dhaka A</option></select><select><option>全部业务状态</option><option>待处理</option><option>跟进中</option></select><select><option>全部归属状态</option><option>已分配</option><option>已释放</option></select><input placeholder="案件 ID / 客户姓名"><button class="btn">筛选</button></div><div class="table-wrap"><table><thead><tr><th></th><th>案件 / 客户</th><th>市场</th><th>推广产品</th><th>当前归属</th><th>业务状态</th><th>SLA / 下一步</th><th>操作</th></tr></thead><tbody>${caseTableRows()}</tbody></table></div><div class="notice" style="margin-top:12px">已选择 <b id="selectedCount">${state.selected.size}</b> 个案件。释放会回到队列；调配会直接变更团队或坐席并保留全部历史。</div>`}
    function monitor(){return `${head("实时任务监控","查看当前坐席状态、任务容量与首呼 SLA","<button class='btn' data-go='transfer'>进入调配</button>")}${stats([["在线坐席","91 / 102"],["通话中","36","39.6%"],["接单暂停","7","主管可释放案件","warn"],["离线超时","4","涉及 22 个案件","bad"],["首呼超时","18","需要处理","warn"]])}<section class="panel"><div class="panel-head"><b>团队实时容量</b><span>每 30 秒刷新</span></div><div class="team-row" style="background:#f8fafc;color:var(--muted);font-size:9px"><b>团队</b><b>在线</b><b>任务</b><b>容量</b><b>状态</b></div><div class="team-row"><div><b>Luanda A</b><p>安哥拉 · Crédito Flex</p></div><b>18 / 20</b><b>362</b><div class="capacity-bar"><span style="width:76%"></span></div><span class="tag green">正常</span></div><div class="team-row"><div><b>Luanda B</b><p>安哥拉 · Crédito Flex</p></div><b>9 / 10</b><b>194</b><div class="capacity-bar"><span style="width:88%;background:var(--amber)"></span></div><span class="tag amber">偏高</span></div><div class="team-row"><div><b>Dhaka A</b><p>孟加拉 · ReLoan Plus</p></div><b>34 / 38</b><b>806</b><div class="capacity-bar"><span style="width:92%;background:var(--red)"></span></div><span class="tag red">拥堵</span></div><div class="team-row"><div><b>Dhaka B</b><p>孟加拉 · Cash Flex / ReLoan Plus</p></div><b>30 / 34</b><b>612</b><div class="capacity-bar"><span style="width:64%"></span></div><span class="tag green">可接收</span></div></section>`}
    function release(){return `${head("案件释放","解除当前归属并返回可分配队列","<button class='btn primary' id='openBatchRelease'>批量释放</button>")}${stats([["今日已释放","126"],["自动释放","84","66.7%"],["主管释放","32","25.4%"],["坐席申请","10","6 条待审批","warn"],["重新分配成功","119","94.4%"]])}<div class="grid-2"><section class="panel"><div class="panel-head"><b>待处理的释放申请</b><span>坐席不能直接释放</span></div><div class="table-wrap" style="border:0"><table><thead><tr><th>案件</th><th>坐席</th><th>申请原因</th><th>保护状态</th><th>操作</th></tr></thead><tbody><tr><td><strong>BD-1138</strong><span class="sub">Sabina Rahman</span></td><td>Rafi Ahmed</td><td>技术问题</td><td><span class="tag gray">未保护</span></td><td><button class="btn approve-release">审批</button></td></tr><tr><td><strong>AO-0851</strong><span class="sub">Helena Costa</span></td><td>Beatriz João</td><td>客户要求指定坐席</td><td><span class="tag amber">回拨保护</span></td><td><button class="btn approve-release">强制审批</button></td></tr><tr><td><strong>BD-1146</strong><span class="sub">Marzia Akter</span></td><td>Nusrat Ali</td><td>产品权限不匹配</td><td><span class="tag amber">注册中</span></td><td><button class="btn approve-release">强制审批</button></td></tr></tbody></table></div></section><section class="panel"><div class="panel-head"><b>释放策略</b><span>当前规则 v4.2</span></div><div class="panel-body alert-list"><article class="alert good"><div><b>坐席离线超过 30 分钟</b><p>自动释放未拨打案件，回拨和高意向案件进入主管确认。</p></div></article><article class="alert"><div><b>首呼 SLA 超时</b><p>释放至原团队池，并提高下一次分配优先级。</p></div></article><article class="alert"><div><b>团队或批次暂停</b><p>只停止新增分配，不自动释放正在跟进的案件。</p></div></article><div class="notice">释放不会改变“跟进中、等待业务或已转化”等业务状态，也不会删除历史备注。</div></div></section></div>`}
    function transfer(){return `${head("批量调配","同一市场内直接变更团队或负责人","<button class='btn' data-go='cases'>返回案件中心</button>")}<div class="grid-2"><section class="panel"><div class="panel-head"><b>1. 调配范围</b><span>演示选择：3 个案件</span></div><div class="panel-body"><div class="field"><label>市场</label><select id="transferMarket"><option>安哥拉</option><option>孟加拉</option></select></div><div class="field" style="margin-top:11px"><label>来源团队</label><select><option>Luanda A</option><option>Luanda B</option></select></div><div class="field" style="margin-top:11px"><label>案件范围</label><select><option>仅未拨打案件</option><option>包括普通跟进案件</option><option>当前勾选案件</option></select></div><div class="notice amber" style="margin-top:13px">高意向、预约回拨或正在申请的案件默认受保护，必须由总部或国家主管强制调配。</div></div></section><section class="panel"><div class="panel-head"><b>2. 目标归属</b><span>目标必须属于同一市场</span></div><div class="panel-body"><div class="field"><label>调配方式</label><select id="transferMode"><option>按目标团队容量自动均分</option><option>指定团队</option><option>指定坐席</option></select></div><div class="field" style="margin-top:11px"><label>目标团队</label><select><option>Luanda B · 剩余容量 36%</option><option>Luanda A · 剩余容量 24%</option></select></div><div class="field" style="margin-top:11px"><label>调配原因</label><select><option>团队容量再平衡</option><option>坐席休假或离职</option><option>产品技能匹配</option><option>客户指定</option></select></div><div class="field" style="margin-top:11px"><label>备注</label><textarea>Luanda A 当前容量偏高，调配未拨打案件至 Luanda B。</textarea></div></div></section></div><section class="panel" style="margin-top:14px"><div class="panel-head"><b>3. 影响预览</b><span>确认前不会改变案件归属</span></div><div class="grid-3 panel-body"><div class="preview-card"><div class="preview-line"><span>选中案件</span><b>3</b></div><div class="preview-line"><span>可直接调配</span><b style="color:var(--green)">2</b></div><div class="preview-line"><span>受保护</span><b style="color:var(--amber)">1</b></div></div><div class="preview-card"><div class="preview-line"><span>预约回拨</span><b>1</b></div><div class="preview-line"><span>正在通话</span><b>0</b></div><div class="preview-line"><span>容量冲突</span><b>0</b></div></div><div class="preview-card"><div class="preview-line"><span>来源容量</span><b>76%</b></div><div class="preview-line"><span>目标调配后</span><b>66%</b></div><div class="preview-line"><span>预计完成</span><b>立即</b></div></div></div><div style="padding:0 15px 15px;display:flex;justify-content:flex-end"><button class="btn primary" id="confirmTransfer">确认调配 3 个案件</button></div></section>`}
    function rules(){const actions=`<button class="btn">复制规则</button><button class="btn primary" id="publishRule">${state.rulePublished?"已发布 v4.2":"发布规则"}</button>`;return `${head("分配规则","国家隔离 → 产品与语言 → 团队 → 坐席容量",actions)}<div class="grid-2"><section class="panel"><div class="panel-head"><b>规则路径</b><span>从上到下执行</span></div><div class="panel-body"><div class="rule-step active"><b>01 · 市场硬隔离</b><p>安哥拉案件只能进入安哥拉团队，孟加拉同理。</p></div><div class="rule-step"><b>02 · 产品与语言资格</b><p>推广产品权限、客户语言、允许联系时段。</p></div><div class="rule-step"><b>03 · 团队容量</b><p>在线坐席数、剩余容量、团队暂停状态。</p></div><div class="rule-step"><b>04 · 坐席选择</b><p>容量 × 公平性 × 技能匹配的加权轮询。</p></div><div class="rule-step"><b>05 · 客户保护与回收</b><p>原坐席保护、回拨优先、超时自动释放。</p></div></div></section><section class="panel"><div class="panel-head"><b>优先级权重</b><span>草稿 · v4.2</span></div><div class="panel-body"><div class="weight"><label>名单新鲜度</label><input type="range" value="35"><b>35%</b></div><div class="weight"><label>客户意向与生命周期</label><input type="range" value="25"><b>25%</b></div><div class="weight"><label>产品活动优先级</label><input type="range" value="20"><b>20%</b></div><div class="weight"><label>回拨紧迫度</label><input type="range" value="20"><b>20%</b></div><div class="notice green">合计 100% · 坐席选择使用加权轮询，坐席端不可查看或挑选名单。</div></div></section></div>`}
    function teams(){return `${head("团队与坐席容量","配置市场、语言、产品权限和案件上限","<button class='btn primary'>新增团队</button>")}<div class="grid-3"><article class="batch"><div class="batch-top"><div><h3>Luanda A</h3><p>安哥拉 · 葡萄牙语 · Crédito Flex</p></div><button class="toggle on" data-toggle></button></div><div class="batch-metrics"><div><small>坐席</small><b>20</b></div><div><small>在线</small><b>18</b></div><div><small>容量</small><b>76%</b></div></div></article><article class="batch"><div class="batch-top"><div><h3>Dhaka A</h3><p>孟加拉 · 孟加拉语 · ReLoan Plus</p></div><button class="toggle on" data-toggle></button></div><div class="batch-metrics"><div><small>坐席</small><b>38</b></div><div><small>在线</small><b>34</b></div><div><small>容量</small><b style="color:var(--red)">92%</b></div></div></article><article class="batch"><div class="batch-top"><div><h3>Dhaka B</h3><p>孟加拉 · 孟加拉语 · Cash Flex / ReLoan</p></div><button class="toggle on" data-toggle></button></div><div class="batch-metrics"><div><small>坐席</small><b>34</b></div><div><small>在线</small><b>30</b></div><div><small>容量</small><b>64%</b></div></div></article></div><section class="panel" style="margin-top:14px"><div class="panel-head"><b>坐席资格示例</b><span>市场权限不能由团队组长跨国修改</span></div><div class="table-wrap" style="border:0"><table><thead><tr><th>坐席</th><th>市场 / 团队</th><th>语言</th><th>产品权限</th><th>任务容量</th><th>工作状态</th></tr></thead><tbody><tr><td><strong>Ana Pedro</strong><span class="sub">AO-A-018</span></td><td>安哥拉 / Luanda A</td><td>Português</td><td>Crédito Flex</td><td>18 / 24</td><td><span class="tag green">在线</span></td></tr><tr><td><strong>Rafi Ahmed</strong><span class="sub">BD-A-028</span></td><td>孟加拉 / Dhaka A</td><td>বাংলা</td><td>ReLoan Plus</td><td>14 / 24</td><td><span class="tag green">在线</span></td></tr><tr><td><strong>Nusrat Ali</strong><span class="sub">BD-B-014</span></td><td>孟加拉 / Dhaka B</td><td>বাংলা / English</td><td>Cash Flex / ReLoan</td><td>21 / 24</td><td><span class="tag amber">通话中</span></td></tr></tbody></table></div></section>`}
    function audit(){return `${head("操作审计","每次分配、释放、调配和规则发布均不可删除","<button class='btn'>导出审计记录</button>")}<div class="filters"><select><option>全部操作</option><option>自动分配</option><option>释放</option><option>调配</option></select><select><option>全部市场</option><option>安哥拉</option><option>孟加拉</option></select><select><option>全部操作人</option><option>系统</option><option>国家主管</option></select><input type="date" value="2026-08-01"><input placeholder="案件 ID"><button class="btn">查询</button></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>操作</th><th>市场</th><th>对象</th><th>操作人</th><th>变更</th><th>原因 / 规则版本</th></tr></thead><tbody><tr><td>10:02:18</td><td><span class="tag green">自动分配</span></td><td>孟加拉</td><td>BD-1138</td><td>系统</td><td>市场池 → Rafi Ahmed</td><td>v4.2 · 容量 × 公平轮询</td></tr><tr><td>09:58:41</td><td><span class="tag amber">释放</span></td><td>安哥拉</td><td>AO-0831</td><td>João Silva</td><td>Manuel José → Luanda A 池</td><td>坐席离线超过 30 分钟</td></tr><tr><td>09:54:22</td><td><span class="tag">批量调配</span></td><td>孟加拉</td><td>37 个案件</td><td>林一凡</td><td>Dhaka A → Dhaka B</td><td>团队容量再平衡</td></tr><tr><td>09:40:07</td><td><span class="tag gray">规则发布</span></td><td>全部</td><td>分配规则 v4.2</td><td>林一凡</td><td>草稿 → 生效</td><td>新增回拨保护条件</td></tr><tr><td>09:31:16</td><td><span class="tag red">强制调配</span></td><td>安哥拉</td><td>AO-0808</td><td>Paulo Costa</td><td>Ana Pedro → Beatriz João</td><td>客户指定 · 保留回拨时间</td></tr></tbody></table></div>`}
    const pages={overview,upload,batches,cases,monitor,release,transfer,rules,teams,audit};
    function render(){document.getElementById("navGlobal").innerHTML=navGlobal.map(n=>`<button data-go="${n[0]}" class="${state.page===n[0]?"active":""}">${n[1]}</button>`).join("");document.getElementById("navAllocation").innerHTML=navAllocation.map(n=>`<button data-go="${n[0]}" class="${state.page===n[0]?"active":""}">${n[1]}</button>`).join("");const name=[...navGlobal,...navAllocation].find(n=>n[0]===state.page)[1];document.getElementById("crumb").innerHTML=`统一后管 / <b>${name}</b>`;document.getElementById("marketSelect").value=state.market;document.getElementById("main").innerHTML=pages[state.page]();bind();}
    function go(page){state.page=page;render()}
    function bind(){document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll("[data-queue]").forEach(el=>el.onclick=()=>{state.queue=el.dataset.queue;render()});document.querySelectorAll(".case-check").forEach(el=>el.onchange=()=>{el.checked?state.selected.add(el.value):state.selected.delete(el.value);document.getElementById("selectedCount").textContent=state.selected.size});document.querySelectorAll("[data-view-case]").forEach(el=>el.onclick=()=>openCase(el.dataset.viewCase));const rel=document.getElementById("releaseSelected");if(rel)rel.onclick=()=>openRelease(state.selected.size);const trans=document.getElementById("transferSelected");if(trans)trans.onclick=()=>go("transfer");const up=document.getElementById("simulateUpload");if(up)up.onclick=()=>{state.fileReady=true;showToast("演示文件已解析，可进行校验");render()};const validate=document.getElementById("validateUpload");if(validate)validate.onclick=()=>showToast("校验完成：有效 6,556 · 隔离 244 · 可进入分配预览");const batch=document.getElementById("openBatchRelease");if(batch)batch.onclick=()=>openRelease(18);document.querySelectorAll(".approve-release").forEach(el=>el.onclick=()=>openRelease(1));const confirm=document.getElementById("confirmTransfer");if(confirm)confirm.onclick=openTransferConfirm;const pub=document.getElementById("publishRule");if(pub)pub.onclick=()=>openPublish();document.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{el.classList.toggle("on");showToast(el.classList.contains("on")?"团队已恢复接收新案件":"团队已暂停接收新案件")});}
    function openModal(title,body,confirmLabel,onConfirm,kind="primary"){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;const c=document.getElementById("modalConfirm");c.textContent=confirmLabel;c.className=`btn ${kind}`;c.onclick=()=>{document.getElementById("actionModal").classList.remove("show");onConfirm&&onConfirm()};document.getElementById("actionModal").classList.add("show")}
    function openRelease(count){if(!count){showToast("请先选择需要释放的案件");return}openModal(`释放 ${count} 个案件`,`<div class="notice amber">释放只解除当前归属，不会结束推广或清空客户生命周期。受保护案件需要强制权限。</div><div class="field" style="margin-top:12px"><label>释放去向</label><select><option>返回原团队案件池</option><option>返回市场公共池</option><option>指定团队案件池</option><option>冻结等待人工处理</option></select></div><div class="field" style="margin-top:11px"><label>释放原因</label><select><option>坐席离线或无法继续处理</option><option>语言或产品权限不匹配</option><option>团队容量再平衡</option><option>客户指定其他坐席</option></select></div><div class="field" style="margin-top:11px"><label>操作备注</label><textarea placeholder="必填，将写入操作审计"></textarea></div>`,`确认释放`,()=>showToast(`${count} 个案件已释放并进入重新分配队列`),"warning")}
    function openTransferConfirm(){openModal("确认跨团队调配",`<div class="notice">2 个案件可直接调配；1 个预约回拨案件受保护，确认后将保留回拨时间和沟通摘要。</div><div class="preview-card" style="margin-top:12px"><div class="preview-line"><span>来源</span><b>Luanda A</b></div><div class="preview-line"><span>目标</span><b>Luanda B · 自动均分</b></div><div class="preview-line"><span>案件数</span><b>3</b></div><div class="preview-line"><span>调配原因</span><b>团队容量再平衡</b></div></div>`,`确认调配`,()=>showToast("3 个案件已调配，原负责人链路已写入审计"))}
    function openPublish(){openModal("发布分配规则 v4.2",`<div class="notice amber">发布后会影响两个市场后续新分配，不改变已经完成或正在通话的任务。</div><div class="preview-card" style="margin-top:12px"><div class="preview-line"><span>生效市场</span><b>安哥拉 / 孟加拉</b></div><div class="preview-line"><span>主要变化</span><b>回拨保护＋离线回收</b></div><div class="preview-line"><span>回滚点</span><b>v4.1</b></div></div>`,`发布规则`,()=>{state.rulePublished=true;showToast("规则 v4.2 已发布");render()})}
    function openCase(id){const row=caseRows.find(r=>r[0]===id);openModal(`案件 ${id}`,`<div class="case-detail"><h2>${row[2]}</h2><p>${row[1]} · ${row[3]}</p><div class="detail-grid"><div><small>业务状态</small><b>${row[5]}</b></div><div><small>当前归属</small><b>${row[4]}</b></div><div><small>下一步</small><b>${row[6]}</b></div><div><small>注册</small><b>已完成</b></div><div><small>借款</small><b>已结清</b></div><div><small>复借</small><b>可复借</b></div></div><div class="notice green" style="margin-top:12px">客户历史、通话记录与归属事件会随案件一起保留。</div></div>`,`关闭`,null)}
    function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
    document.getElementById("marketSelect").onchange=e=>{state.market=e.target.value;state.selected.clear();render()};document.addEventListener("click",e=>{if(e.target.matches("[data-close-modal]"))document.getElementById("actionModal").classList.remove("show")});render();
  </script>
</body>
</html>
