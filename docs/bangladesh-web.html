<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Linha Clara · Bangladesh Agent Desk</title>
  <!--
    已确认方向：第一套 Clear Operations。
    角色边界：本页面只服务孟加拉电销坐席，不提供名单池、分配规则或团队管理。
    核心闭环：自动派单 → 客户上下文 → 桌面呼叫 → 强制登记 → 回拨/下一位。
    本原型使用演示数据，不连接真实电话、录音或现金贷业务接口。
  -->
  <style>
    *{box-sizing:border-box}
    :root{--nav:#10233f;--nav-2:#17345c;--blue:#2563eb;--blue-pale:#e9f0ff;--green:#11845b;--green-pale:#e8f6f0;--amber:#c27a16;--amber-pale:#fff4dc;--red:#c84747;--red-pale:#fff0f0;--ink:#14213a;--muted:#68758b;--line:#d7dfeb;--soft:#f3f6fa;--paper:#fff}
    html,body{margin:0;min-height:100%;background:var(--soft);color:var(--ink)}
    body{font-family:"Noto Sans Bengali","Hind Siliguri","Noto Sans SC","PingFang SC",sans-serif;font-size:13px}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}
    .sidebar{background:var(--nav);color:#fff;min-height:100vh;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
    .brand{padding:0 10px 22px;border-bottom:1px solid rgba(255,255,255,.13)}
    .brand b{display:block;font-size:17px;letter-spacing:.01em}.brand small{display:block;margin-top:5px;color:#9eb0ca;font-size:9px;letter-spacing:.13em;text-transform:uppercase}
    .scope{margin:18px 10px 10px;color:#8094b1;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .nav{display:grid;gap:3px}
    .nav button{position:relative;border:0;background:transparent;color:#bdcadc;text-align:left;padding:11px 12px;font-weight:700}
    .nav button:hover{background:#152f53;color:#fff}.nav button.active{background:#1d3e6b;color:#fff}
    .nav button.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#4d7fff}
    .side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.13);padding:15px 10px 0;color:#aab9cd}
    .agent-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.online{display:inline-flex;align-items:center;gap:6px;color:#7de3b7;font-weight:700}.online:before{content:"";width:7px;height:7px;border-radius:50%;background:#34c78d}
    .capacity{margin-top:11px;height:4px;background:#294362}.capacity span{display:block;width:58%;height:100%;background:#4dd2a0}
    .shell{min-width:0}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
    .crumb{color:var(--muted)}.crumb b{color:var(--ink)}
    .top-actions{display:flex;align-items:center;gap:9px}.clock{color:var(--green);font-weight:800}.lang-link,.ghost{height:34px;border:1px solid var(--line);background:#fff;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:700}.ghost:hover,.lang-link:hover{border-color:#8ea4c2}
    .main{padding:26px 28px 44px;max-width:1500px;margin:0 auto}
    .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.head h1{font-size:27px;margin:0 0 6px;letter-spacing:-.02em}.head p{margin:0;color:var(--muted)}
    .actions{display:flex;gap:8px}.btn{height:38px;border:1px solid var(--line);background:#fff;padding:0 15px;font-weight:800}.btn:hover{border-color:#8aa2c3}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.danger{border-color:#e2bcbc;color:#a83e3e;background:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:#fff;margin-bottom:16px}.stat{padding:16px 18px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat small{display:block;color:var(--muted);margin-bottom:8px}.stat b{font-size:24px}.stat em{display:block;margin-top:5px;font-style:normal;color:var(--green);font-size:10px;font-weight:800}.stat em.warn{color:var(--amber)}
    .grid-2{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(300px,.82fr);gap:15px}.grid-even{grid-template-columns:1fr 1fr}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .panel{background:#fff;border:1px solid var(--line)}.panel-head{min-height:47px;border-bottom:1px solid var(--line);padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head b{font-size:14px}.panel-head span,.panel-head small{color:var(--muted);font-size:10px}.panel-body{padding:15px}
    .notice{padding:11px 13px;background:var(--blue-pale);color:#244d99;border:1px solid #ccdaf6;line-height:1.55}.notice.amber{background:var(--amber-pale);color:#835616;border-color:#efd9ab}.notice.green{background:var(--green-pale);color:#146546;border-color:#cce8dc}
    .case-hero{display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}.initials{width:48px;height:48px;background:#e3ebfa;display:grid;place-items:center;font-weight:900;color:#2457aa}.case-hero h2{margin:0 0 4px;font-size:20px}.case-hero p{margin:0;color:var(--muted)}.priority{text-align:center;background:var(--blue-pale);padding:9px 13px}.priority b{font-size:22px;color:var(--blue)}.priority small{display:block;color:#5571a2}
    .case-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-width:0 1px 1px 0;margin-top:14px}.case-grid div{padding:12px;border:1px solid var(--line);border-width:1px 0 0 1px}.case-grid small{display:block;color:var(--muted);margin-bottom:6px}.case-grid b{font-size:12px}
    .timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:70px 13px 1fr;gap:10px;min-height:54px}.event time{color:var(--muted);font-size:10px}.event i{width:8px;height:8px;border-radius:50%;background:#8aa2c3;margin-top:3px;position:relative}.event i:after{content:"";position:absolute;top:10px;bottom:-45px;left:3px;width:1px;background:var(--line)}.event:last-child i:after{display:none}.event b{display:block;font-size:11px;margin-bottom:3px}.event p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}
    .call-box{background:var(--nav);color:#fff;min-height:330px;display:grid;place-items:center;text-align:center;padding:30px}.call-box small{color:#9eb0ca}.phone{font-size:28px;margin:15px 0 7px;letter-spacing:.05em}.call-state{color:#b8c6d8;min-height:20px}.call-timer{font-size:34px;font-variant-numeric:tabular-nums;margin:16px 0}.round-call{width:118px;height:44px;border:0;background:#2b69ef;color:#fff;font-weight:900}.round-call.end{background:#c94949}.record{margin-top:18px;color:#7de3b7;font-size:10px;font-weight:800}
    .script{padding:12px 0;border-bottom:1px solid var(--line)}.script:last-child{border-bottom:0}.script b{display:block;margin-bottom:7px}.script p{margin:0;color:#44536a;line-height:1.75}.script mark{background:var(--amber-pale);padding:1px 3px}
    .result-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.result{border:1px solid var(--line);background:#fff;text-align:left;padding:12px;min-height:58px;font-weight:700}.result small{display:block;margin-top:5px;color:var(--muted);font-weight:500}.result.selected{border-color:var(--blue);background:var(--blue-pale);color:#174ba9}
    .field{display:grid;gap:6px;margin-top:12px}.field label{color:var(--muted);font-size:10px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;padding:10px}.field textarea{min-height:82px;resize:vertical}
    .callbacks{display:grid;gap:8px}.callback{display:grid;grid-template-columns:110px 1fr 130px 110px;align-items:center;border:1px solid var(--line);padding:12px;background:#fff}.callback time{font-weight:900}.callback p{margin:2px 0 0;color:var(--muted);font-size:10px}.tag{display:inline-flex;width:max-content;padding:5px 7px;background:var(--blue-pale);color:#2555a8;font-size:9px;font-weight:800}.tag.green{background:var(--green-pale);color:var(--green)}.tag.amber{background:var(--amber-pale);color:#945f14}
    .bar-row{display:grid;grid-template-columns:130px 1fr 70px;gap:12px;align-items:center;margin:13px 0}.bar{height:8px;background:#e8edf4}.bar span{display:block;height:100%;background:var(--blue)}.bar-row b{text-align:right}.metric-table{width:100%;border-collapse:collapse}.metric-table th,.metric-table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}.metric-table th{color:var(--muted);font-size:10px;background:#f8fafc}.metric-table td:last-child{text-align:right;font-weight:800}
    .login-card{max-width:470px;margin:50px auto;background:#fff;border:1px solid var(--line);padding:30px}.login-card h2{font-size:25px;margin:0 0 7px}.login-card>p{color:var(--muted);margin:0 0 22px}.device-check{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.device-check span:last-child{color:var(--green);font-weight:800}
    .empty-next{padding:35px;text-align:center;color:var(--muted)}
    .toast{position:fixed;right:24px;bottom:24px;min-width:300px;background:#172844;color:#fff;padding:14px 16px;box-shadow:0 16px 40px rgba(16,35,63,.24);transform:translateY(90px);opacity:0;transition:.25s;z-index:30}.toast.show{transform:none;opacity:1}
    .modal{position:fixed;inset:0;background:rgba(10,24,45,.48);display:none;place-items:center;z-index:40}.modal.show{display:grid}.modal-card{width:min(500px,calc(100vw - 30px));background:#fff;border:1px solid var(--line)}.modal-head{padding:17px 18px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
    @media(max-width:1050px){.app{grid-template-columns:190px minmax(0,1fr)}.grid-2,.grid-even{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.callback{grid-template-columns:90px 1fr}.callback>*:nth-child(n+3){margin-top:8px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><b>Linha Clara Desk</b><small>Bangladesh telesales</small></div>
      <div class="scope" id="navScope"></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="agent-line"><b id="agentName"></b><span class="online" id="agentState"></span></div>
        <small id="capacityText"></small><div class="capacity"><span></span></div>
      </div>
    </aside>
    <section class="shell">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <div class="top-actions"><span class="clock" id="clock"></span><a class="lang-link" id="langLink"></a><button class="ghost" data-go="login" id="sessionButton"></button></div>
      </header>
      <main class="main" id="main"></main>
    </section>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal" id="releaseModal">
    <div class="modal-card">
      <div class="modal-head"><h3 id="releaseTitle"></h3></div>
      <div class="panel-body">
        <div class="notice amber" id="releaseNote"></div>
        <div class="field"><label id="releaseReasonLabel"></label><select id="releaseReason"></select></div>
        <div class="field"><label id="releaseCommentLabel"></label><textarea id="releaseComment"></textarea></div>
      </div>
      <div class="modal-actions"><button class="btn" data-close-modal id="releaseCancel"></button><button class="btn danger" id="releaseConfirm"></button></div>
    </div>
  </div>
  <script>
    const isZh=location.pathname.includes("-zh")||new URLSearchParams(location.search).get("lang")==="zh";
    document.documentElement.lang=isZh?"zh-CN":"bn";
    const x=(bn,zh)=>isZh?zh:bn;
    const navItems=[
      ["login",x("লগইন ও শিফট","登录与班次")],["today",x("আজকের ডেস্ক","今日工作台")],["customer",x("বর্তমান গ্রাহক","当前客户")],
      ["call",x("কল ও স্ক্রিপ্ট","呼叫与话术")],["result",x("ফলাফল নিবন্ধন","结果登记")],["callbacks",x("ফেরত কল","回拨日程")],["performance",x("আমার পারফরম্যান্স","个人绩效")]
    ];
    const state={page:"today",online:true,calling:false,seconds:0,result:"",timer:null};
    const head=(title,sub,actions="")=>`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;
    const stats=items=>`<section class="stats">${items.map(i=>`<div class="stat"><small>${i[0]}</small><b>${i[1]}</b>${i[2]?`<em class="${i[3]||""}">${i[2]}</em>`:""}</div>`).join("")}</section>`;

    function render(){document.title=isZh?"孟加拉 Web 电销坐席端｜中文讲解":"Linha Clara · Bangladesh Agent Desk";document.getElementById("navScope").textContent=x("আমার কাজ","我的工作");document.getElementById("nav").innerHTML=navItems.map(n=>`<button data-go="${n[0]}" class="${state.page===n[0]?"active":""}">${n[1]}</button>`).join("");document.getElementById("agentName").textContent=x("রাফি আহমেদ","Rafi Ahmed");document.getElementById("agentState").textContent=state.online?x("অনলাইন","在线"):x("বিরতি","暂停");document.getElementById("capacityText").textContent=x("ক্ষমতা 14 / 24","容量 14 / 24");document.getElementById("crumb").innerHTML=`${x("বাংলাদেশ","孟加拉")} / <b>${navItems.find(n=>n[0]===state.page)[1]}</b>`;document.getElementById("langLink").textContent=isZh?"বাংলা业务版":"中文讲解版";document.getElementById("langLink").href=isZh?"bangladesh-web.html":"bangladesh-web-zh.html";document.getElementById("sessionButton").textContent=x("শিফট","班次");document.getElementById("main").innerHTML=pages[state.page]();bindPage();}
    function go(page){state.page=page;render();}
    function bindPage(){document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));const start=document.getElementById("startShift");if(start)start.onclick=()=>{state.online=true;showToast(x("শিফট শুরু হয়েছে","班次已开始"));go("today")};const pause=document.getElementById("pauseShift");if(pause)pause.onclick=()=>{state.online=!state.online;showToast(state.online?x("আপনি আবার অনলাইন","已恢复接单"):x("নতুন বরাদ্দ স্থগিত","已暂停新案件派发"));render()};const req=document.getElementById("requestRelease");if(req)req.onclick=openRelease;const call=document.getElementById("callButton");if(call)call.onclick=toggleCall;document.querySelectorAll("[data-result]").forEach(el=>el.onclick=()=>{state.result=el.dataset.result;render()});const save=document.getElementById("saveResult");if(save)save.onclick=()=>{showToast(x("ফলাফল সংরক্ষিত · পরবর্তী কেস প্রস্তুত","结果已保存 · 下一位客户已准备"));state.result="";go("today")};}
    function formatTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
    function toggleCall(){state.calling=!state.calling;if(state.calling){state.timer=setInterval(()=>{state.seconds++;const t=document.getElementById("callTimer");if(t)t.textContent=formatTime(state.seconds)},1000);showToast(x("কল সংযুক্ত · রেকর্ডিং চলছে","通话已接通 · 正在录音"));render()}else{clearInterval(state.timer);state.timer=null;showToast(x("কল শেষ · ফলাফল নিবন্ধন করুন","通话结束 · 请登记结果"));go("result")}}
    function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
    function openRelease(){document.getElementById("releaseTitle").textContent=x("কেস রিলিজের আবেদন","申请释放案件");document.getElementById("releaseNote").textContent=x("রিলিজ করলে কেসটি Dhaka A পুলে ফিরে যাবে। ইতিহাস ও গ্রাহকের অবস্থা সংরক্ষিত থাকবে।","释放后案件返回 Dhaka A 队列，沟通历史和客户状态不会被清空。");document.getElementById("releaseReasonLabel").textContent=x("কারণ","释放原因");document.getElementById("releaseReason").innerHTML=`<option>${x("ভাষা বা পণ্য মেলে না","语言或产品不匹配")}</option><option>${x("প্রযুক্তিগত সমস্যা","技术问题")}</option><option>${x("গ্রাহক নির্দিষ্ট কর্মী চেয়েছেন","客户要求指定坐席")}</option>`;document.getElementById("releaseCommentLabel").textContent=x("বিস্তারিত মন্তব্য","补充说明");document.getElementById("releaseComment").placeholder=x("কারণ লিখুন","请填写具体原因");document.getElementById("releaseCancel").textContent=x("বাতিল","取消");document.getElementById("releaseConfirm").textContent=x("আবেদন জমা দিন","提交申请");document.getElementById("releaseModal").classList.add("show")}
    document.addEventListener("click",e=>{if(e.target.matches("[data-close-modal]"))document.getElementById("releaseModal").classList.remove("show")});
    document.getElementById("releaseConfirm").onclick=()=>{document.getElementById("releaseModal").classList.remove("show");showToast(x("রিলিজের আবেদন সুপারভাইজারের কাছে পাঠানো হয়েছে","释放申请已提交主管审批"));go("today")};
    function updateClock(){document.getElementById("clock").textContent=new Intl.DateTimeFormat(isZh?"zh-CN":"bn-BD",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:"Asia/Dhaka"}).format(new Date())}
    setInterval(updateClock,1000);render();updateClock();
  </script>
